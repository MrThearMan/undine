name: Federation compatibility

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "undine/**"
      - "tests/test_federation/compatibility/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/federation-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  federation-compatibility:
    name: "Apollo Federation subgraph compatibility"
    runs-on: "ubuntu-latest"

    # Cancel old workflows when a new workflow is triggered for the same PR/branch/tag
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        shell: bash

    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Set up python"
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.10"
          enable-cache: true

      - name: "Install dependencies"
        run: |
          uv sync --locked --all-extras --all-groups --python "${{ steps.setup-python.outputs.python-path }}"

      - name: "Export subgraph schema"
        working-directory: tests/test_federation/compatibility
        run: |
          uv run --no-sync python manage.py export

      - name: "Run Apollo subgraph compatibility harness"
        uses: apollographql/federation-subgraph-compatibility@v3
        with:
          workingDirectory: tests/test_federation/compatibility
          compose: docker-compose.yaml
          schema: schema.graphql
          port: 4001
          failOnWarning: true
          failOnRequired: true
