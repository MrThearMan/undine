[project]
site_name = "Undine"
site_description = "Undine: A batteries-included GraphQL library for Django."
site_url = "https://mrthearman.github.io/undine/"

repo_url = "https://github.com/MrThearMan/undine"
repo_name = "MrThearMan/undine"

extra_css = [
  "css/docs.css",
  "css/pygments.css",
]
extra_javascript = [
  "js/docs.js",
]

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "Tutorial" = "tutorial.md" },
  { "Schema" = "schema.md" },
  { "Queries" = "queries.md" },
  { "Mutations" = "mutations.md" },
  { "Filtering" = "filtering.md" },
  { "Ordering" = "ordering.md" },
  { "Pagination" = "pagination.md" },
  { "Subscriptions" = "subscriptions.md" },
  { "Global Object IDs" = "global-object-ids.md" },
  { "File Upload" = "file-upload.md" },
  { "Persisted Documents" = "persisted-documents.md" },
  { "Interfaces" = "interfaces.md" },
  { "Unions" = "unions.md" },
  { "Scalars" = "scalars.md" },
  { "Directives" = "directives.md" },
  { "Federation" = "federation.md" },
  { "Visibility" = "visibility.md" },
  { "Hacking Undine" = "hacking-undine.md" },
  { "Optimizer" = "optimizer.md" },
  { "Caching" = "caching.md" },
  { "Async Support" = "async.md" },
  { "DataLoaders" = "dataloaders.md" },
  { "Incremental Delivery" = "incremental.md" },
  { "Lifecycle Hooks" = "lifecycle-hooks.md" },
  { "Validation Rules" = "validation-rules.md" },
  { "Integrations" = "integrations.md" },
  { "Settings" = "settings.md" },
  { "FAQ" = "faq.md" },
  { "Contributing" = "contributing.md" },
]

[project.theme]
variant = "modern"
custom_dir = "overrides"
language = "en"
features = [
  "content.code.copy",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"

[project.markdown_extensions]
attr_list = {}
meta = {}
toc.permalink = "🔗"
pymdownx.blocks.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.linenums = true
pymdownx.inlinehilite = {}
pymdownx.snippets.base_path = "docs/snippets"
pymdownx.tasklist = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
