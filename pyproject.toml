[project]
name = "undine"
version = "0.4.0"
description = "A GraphQL library for Django"
authors = [
    { name = "Matti Lamppu", email = "lamppu.matti.akseli@gmail.com" },
]
license = "MIT"
readme = "README.md"
keywords = [
    "Django",
    "GraphQL",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
]
requires-python = ">=3.11,<4"
dependencies = [
    "django>=5.0",
    "graphql-core>=3.2.12",
    "django-settings-holder>=0.3.0",
    "sqlparse>=0.6.0",
]

[project.optional-dependencies]
image = ["pillow>=12.3.0"]
debug = ["django-debug-toolbar>=7.1.1"]
channels = ["channels>=4.2.2"]
federation-tracing = ["protobuf>=7.36.0"]
opentelemetry = ["opentelemetry-api>=1.38.0"]
datadog = ["ddtrace>=3.0.0"]
sentry = ["sentry-sdk>=2.0.0"]

[project.urls]
"Homepage" = "https://mrthearman.github.io/undine"
"Repository" = "https://github.com/MrThearMan/undine"
"Bug Tracker" = "https://github.com/MrThearMan/undine/issues"
"Documentation" = "https://mrthearman.github.io/undine"

[project.entry-points."mypy.plugins"]
mypy_undine = "mypy_undine:plugin"

[project.entry-points.pytest11]
undine = "pytest_undine.fixtures"

[dependency-groups]
# Development installs the library with every extra, so that "uv run" needs no
# extra flags and every optional integration is importable.
dev = [
    "undine[image,debug,channels,federation-tracing,opentelemetry,datadog,sentry]",
]
test = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-asyncio==1.4.0",
    "pytest-mypy-plugins==4.0.3",
    "coverage==7.15.4",
    "hypothesis==6.165.10",
    "freezegun==1.5.5",
    "factory-boy==3.3.3",
    "nox==2026.8.17",
    "urllib3==2.7.0",
    "django-modeltranslation==0.20.3",
    "psycopg[binary,pool]==3.3.4",
    "granian[pname,uvloop,reload]==2.8.2",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
]
docs = [
    "zensical==0.0.59",
    "pymdown-extensions==11.0.2",
    "pygments==2.21.0",
]
lint = [
    "prek==0.5.2",
    "py-spy==0.4.2",
    "httpx==0.28.1",
    "ruff==0.16.3",
    "mypy==2.3.1",
    "django-stubs==5.2.9",
    "channels-stubs==0.1.9",
    "types-protobuf==7.35.1.20260827",
]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
# Lets the "dev" group name this project's own extras.
undine = { workspace = true }

[tool.uv.build-backend]
# The packages sit at the repository root, not under "src".
module-root = ""
module-name = [
    "undine",
    "mypy_undine",
    "pytest_undine",
]

[tool.coverage.run]
relative_files = true
branch = true
include = [
    "undine/*",
]
omit = [
    "docs/*",
    "example_project/*",
    "mypy_undine/*",
    "pytest_undine/*",
    "tests/*",
    "undine/persisted_documents/migrations/*",
    "undine/utils/graphql/introspection.py",  # grpahql-core>=3.3.0a12 required
    "async.py",
    "manage.py",
    "noxfile.py",
]

[tool.coverage.report]
exclude_also = [
    'if TYPE_CHECKING:',
    'except ImportError:',
    'with suppress\(ImportError\):',
    'with contextlib.suppress\(ImportError\):',
    'class .+\(.*\bProtocol(\[.+\])?\):',
    'pragma: no cover',
    'pragma: no branch',
    '\A(?s:.*# pragma: exclude file.*)\Z',
    'pass',
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "example_project.project.settings"
addopts = "--disable-warnings"
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
